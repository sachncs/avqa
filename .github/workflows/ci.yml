name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ tests/ examples/ benchmarks/ scripts/
      - run: ruff format --check src/ tests/ examples/ benchmarks/ scripts/

  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/check_metadata.py
      - run: python scripts/check_claims.py
      - run: python scripts/check_docs_links.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm audit --audit-level=high
        working-directory: site
      - run: npm run typecheck
        working-directory: site
      - run: npm run check:routes
        working-directory: site
      - run: npm run check:contrast
        working-directory: site
      - run: npm run lint
        working-directory: site
      - run: npm run format:check
        working-directory: site
      - run: npm run build
        working-directory: site

  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "torch>=2.1" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: mypy src/avqa

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.python-version == '3.15' }}
      - run: python scripts/check_python_support.py --interpreter python
      - run: pip install "torch>=2.1" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,viz]"
      - run: python scripts/check_environment.py
      - name: Repository test target
        if: matrix.python-version == '3.12'
        run: make test
      - name: Unit + reference tests with coverage
        run: |
          pytest tests/unit tests/reference \
            --cov=avqa --cov-report=xml --cov-report=term \
            --cov-fail-under=90 -q
      - name: Integration tests
        run: pytest tests/integration -q
      - name: Execute public examples
        if: matrix.python-version == '3.12'
        run: bash scripts/check_examples.sh
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: ./scripts/check_dist.sh

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Generate requirements from pyproject.toml
        run: |
          python - <<'PY' > /tmp/avqa-reqs.txt
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          deps = list(data["project"]["dependencies"])
          extras = sum(data["project"].get("optional-dependencies", {}).values(), [])
          print("\n".join(deps + extras))
          PY
      - run: pip-audit -r /tmp/avqa-reqs.txt
