    <g fill="#f5a17c"><rect x="18" y="18" width="24" height="24"/><rect x="54" y="54" width="24" height="24"/><rect x="90" y="90" width="24" height="24"/><rect x="126" y="126" width="24" height="24"/></g>
    <text x="0" y="202" fill="#939e8c" font-family="monospace" font-size="10" letter-spacing="1.2">CONCEPTUAL FIGURE · NO PERFORMANCE CLAIM</text>
  </g>
  <path d="M80 530h1040" stroke="#39463a"/>
  <text x="80" y="568" fill="#b3bba9" font-family="monospace" font-size="13" letter-spacing=".6">PYTHON 3.10–3.15 · APACHE 2.0 · CUDA NOT TESTED IN A CUDA ENVIRONMENT</text>
