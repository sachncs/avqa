      <rect x="18" y="54" width="24" height="24"/><rect x="54" y="54" width="24" height="24"/><rect x="90" y="54" width="24" height="24"/><rect x="126" y="54" width="24" height="24"/><rect x="162" y="54" width="24" height="24"/>
      <rect x="18" y="90" width="24" height="24"/><rect x="54" y="90" width="24" height="24"/><rect x="90" y="90" width="24" height="24"/><rect x="126" y="90" width="24" height="24"/><rect x="162" y="90" width="24" height="24"/>
