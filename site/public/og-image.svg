<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">AVQA — Spend compute where attention goes</title>
  <desc id="description">A public-alpha PyTorch research implementation of hierarchical, codebook-routed attention. CPU reference; CUDA has not been tested.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#b3bba9" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0d1510"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <path d="M0 0h8v630H0" fill="#e9784f"/>
  <g transform="translate(80 76)">
    <rect width="44" height="44" fill="#121c15" stroke="#536351"/>
    <path d="M10 10h8v8h8v8h8v8" fill="none" stroke="#e9784f" stroke-width="2"/>
    <g fill="#f5a17c"><rect x="8" y="8" width="4" height="4"/><rect x="16" y="16" width="4" height="4"/><rect x="24" y="24" width="4" height="4"/><rect x="32" y="32" width="4" height="4"/></g>
    <text x="60" y="21" fill="#f5f3e9" font-family="Manrope,Arial,sans-serif" font-size="24" font-weight="800" letter-spacing="2">AVQA</text>
    <text x="61" y="39" fill="#b9d692" font-family="monospace" font-size="8" letter-spacing="1.4">ADAPTIVE ATTENTION</text>
  </g>
  <text x="80" y="250" fill="#939e8c" font-family="monospace" font-size="13" letter-spacing="2">OPEN-SOURCE PYTORCH RESEARCH SOFTWARE · PUBLIC ALPHA</text>
  <text x="76" y="334" fill="#f5f3e9" font-family="Manrope,Arial,sans-serif" font-size="66" font-weight="700" letter-spacing="-3">Spend compute where</text>
  <text x="76" y="410" fill="#b9d692" font-family="Manrope,Arial,sans-serif" font-size="66" font-weight="700" letter-spacing="-3">attention goes.</text>
  <text x="80" y="462" fill="#c6cbbb" font-family="Manrope,Arial,sans-serif" font-size="20">Hierarchical, codebook-routed attention. Inspectable CPU reference.</text>
  <g transform="translate(850 205)">
    <text x="0" y="-20" fill="#939e8c" font-family="monospace" font-size="11" letter-spacing="1.3">GROUP → SCORE → ROUTE → REFINE</text>
